# Ablation: CausalStock w/o Lag-dependent TCD (paper Table 2 target ≈ 59% ACC).
# h_u and h_v become identity → posterior factorizes as ∏_l p(G_l|X_{T-l}).

experiment_name: causalstock_acl18_no_lag_dep

data:
  dataset: acl18
  price_root: reference_data/stocknet-dataset-master/price/preprocessed
  tweet_root: reference_data/stocknet-dataset-master/tweet/preprocessed
  train_start: "2014-01-02"
  train_end:   "2015-08-02"
  valid_start: "2015-08-03"
  valid_end:   "2015-09-30"
  test_start:  "2015-10-01"
  test_end:    "2016-01-01"
  lag_L: 5
  news_per_day: 10
  price_dim: 7
  use_news: true
  movement_threshold: 0.0

model:
  d_p: 4
  d_m: 64
  hidden_size: 332
  use_tcd: true
  lag_dep: false             # ← ablation flag
  h_uv_layers: 1
  gumbel_tau: 0.1            # R-9 fix iter 2: even harder samples
                             # 0.5 still produced chance-level training.
  graph_prior_lambda_s: 1.0
  graph_prior_lambda_d: 0.0

loss:
  bce_weight: 0.01
  noise_init: 0.0

train:
  optimizer: adam
  lr: 1.0e-5
  batch_size: 32
  max_epochs: 100
  early_stop_patience: 30    # R-9 fix: give it more time to escape entropy plateau
  seed: 0

runtime:
  device: cpu
  num_workers: 0
  checkpoint_dir: experiments/checkpoints/acl18_no_lag_dep
  log_dir: experiments/logs/acl18_no_lag_dep
