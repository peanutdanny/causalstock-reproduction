# CausalStock — ACL18 full config.
# All values from docs/paper-summary.md §10 (Appendix C.4).

experiment_name: causalstock_acl18

data:
  dataset: acl18
  price_root: reference_data/stocknet-dataset-master/price/preprocessed
  tweet_root: reference_data/stocknet-dataset-master/tweet/preprocessed
  train_start: "2014-01-02"
  train_end:   "2015-08-02"
  valid_start: "2015-08-03"
  valid_end:   "2015-09-30"
  test_start:  "2015-10-01"
  test_end:    "2016-01-01"
  lag_L: 5             # paper Appendix C.4
  news_per_day: 10     # l = 10
  price_dim: 7         # ACL18 raw price dim
  use_news: true       # ablation flag (w/o news)
  movement_threshold: 0.0  # rise=1 iff close_t > close_{t-1}

model:
  d_p: 4               # price embedding (Appendix C.4)
  d_m: 64              # news embedding (d_m=64)
  hidden_size: 332     # ζ_i, ℓ, ψ hidden (Appendix C.4)
  use_tcd: true        # ablation: w/o TCD
  lag_dep: true        # ablation: w/o lag-dependent TCD
  h_uv_layers: 1       # Appendix C.4 says 1, body §4.3 says 3 — start with 1
  gumbel_tau: 1.0      # TODO(paper-ambiguity): annealing?
  graph_prior_lambda_s: 1.0  # λ_s
  graph_prior_lambda_d: 0.0  # λ_d (no domain prior for baseline)

loss:
  bce_weight: 0.01     # λ from Eq. 14
  noise_init: 0.0      # softplus(0) ≈ 0.693 → reasonable

train:
  optimizer: adam
  lr: 1.0e-5
  batch_size: 32
  max_epochs: 100
  early_stop_patience: 10
  seed: 0

runtime:
  device: cpu          # CPU first per CLAUDE.md
  num_workers: 0
  checkpoint_dir: experiments/checkpoints/acl18
  log_dir: experiments/logs/acl18
